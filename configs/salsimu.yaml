# Salad + Simulation datasets recorded with a chest-mounted GoPro (HEIG-VD / CHUV).
#
# Expected layout: the grasp class is encoded in the directory of each frame, the hand in its file name:
#   frames_simulation/<power|precision|none>/<...left...|...right...>.png
name: salsimu

frame_size: {width: 1920, height: 1080}

frames:
  kind: walk
  root: frames_simulation
  handedness_from: name          # the expected hand ("left"/"right") is looked up in the file name

hands:
  min_detection_confidence: 0.15
  pick: last
  variants:
    - {name: original, kind: plain, dir: null}   # null = the frame's own path

objects:
  weights: yolov8x6.pt
  device: null
  conf: null
  classes: [39, 41, 42, 43, 46, 47, 64, 65, 67, 76]
  image_dir: frames_simu_partial/{grasp}         # {grasp} is also tried with the other classes

landmarks:
  variants:
    - {name: original, kind: plain, dir: "frames_salad/{grasp}"}

depth:
  dir: frames_simu_partial_gs2
  suffix: -dpt_beit_large_512.pfm
  strip_prefix_chars: 0
